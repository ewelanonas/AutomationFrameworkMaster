# Parallel execution is on from the first test, not retrofitted later.
#
# Retrofitting is the trap: by the time anyone tries, the suite has quietly grown
# dependencies on shared state and enabling this turns a green suite red for
# reasons that look like product bugs.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Fixed rather than dynamic, deliberately.
#
# Each concurrent UI test holds a browser context, and each thread holds a whole
# browser plus its driver process. More threads than the machine can feed
# produces timeouts everywhere at once, which reads exactly like a product
# failure and wastes an afternoon.
#
# 4 is also polite to the shared public demo API this template targets. Raise it
# for a service you own, and measure rather than guess.
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4

# A fresh test instance per method. Shared instance state across methods is a
# test-order dependency waiting to happen.
junit.jupiter.testinstance.lifecycle.default = per_method

# Underscores in method names render as spaces in reports, so a test name reads
# as a sentence even where @DisplayName was forgotten.
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
