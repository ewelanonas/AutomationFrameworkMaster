# nginx vhost fronting the Toolshop Laravel API, for CI only.
#
# Why this file exists rather than upstream's `practice-software-testing-web` image:
# that image is published for linux/arm64 ONLY. There is no amd64 variant and no
# other tag, so on a GitHub-hosted amd64 runner the container starts and dies with
# exit 255 and the message "the requested image's platform (linux/arm64) does not
# match the detected host platform (linux/amd64)". Confirmed against the Docker Hub
# tag API: sprint5-api and sprint5-ui are amd64, alpine-mariadb is both, and only
# `web` is arm64-only — an upstream packaging slip, most likely an image built on an
# Apple Silicon machine and never rebuilt for amd64.
#
# The alternative was QEMU emulation of that one container. This is cheaper: a
# FastCGI vhost for a Laravel application is ordinary boilerplate, so we own fifteen
# lines of standard configuration instead of emulating a whole architecture to run
# nginx. It also keeps us clear of copying upstream's own configuration into a public
# repository, which their licence does not grant.
#
# The API image is PHP-FPM only and serves no HTTP, which is why something has to sit
# in front of it at all.

server {
    listen 80;
    server_name _;

    # The API image initialises the shared volume with the application code; this is
    # the Laravel public directory inside it.
    root /var/www/public;
    index index.php;

    # Uploaded and bundled product images are served straight off disk. Without a
    # read-only code mount and this rule, every asset would fall through to PHP and
    # return a Laravel 404 instead of the file.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;

        # SCRIPT_FILENAME must be the path as the PHP-FPM container sees it, which is
        # the same path because both containers mount the same volume at /var/www.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Laravel's longest CI operation is migrate:fresh --seed, which is invoked
        # through `docker compose exec` rather than over HTTP, so these only need to
        # cover ordinary requests.
        fastcgi_read_timeout 60s;
    }

    # Dotfiles are not served. The application ships a .env in the code volume and it
    # must never be reachable over HTTP, not even in a four-minute throwaway container.
    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
